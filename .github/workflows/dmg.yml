name: md_Hero beta build

on:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Beta version label"
        required: true
        default: "2.0.0-beta.1"
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    name: Swift tests
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Run tests
        run: swift test

  dmg:
    name: Build beta DMG
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build app and disk image
        run: ./scripts/make_dmg.sh release "${{ steps.version.outputs.value }}"

      - name: Upload beta DMG
        uses: actions/upload-artifact@v4
        with:
          name: md_Hero-${{ steps.version.outputs.value }}-macOS
          path: |
            build/md_Hero-${{ steps.version.outputs.value }}.dmg
            build/md_Hero-${{ steps.version.outputs.value }}.dmg.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub beta release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "build/md_Hero-${{ steps.version.outputs.value }}.dmg" \
            "build/md_Hero-${{ steps.version.outputs.value }}.dmg.sha256" \
            --title "md_Hero ${{ steps.version.outputs.value }}" \
            --notes "Local macOS beta build. Ad-hoc signed; right-click Open on first launch if Gatekeeper prompts. Not Developer ID notarised."
