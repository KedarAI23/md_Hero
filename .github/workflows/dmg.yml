name: Build DMG

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: swift test

      - name: Build app and DMG
        run: ./scripts/make_dmg.sh release

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: md_Hero-dmg
          path: build/md_Hero-1.0.dmg

      - name: Attach DMG to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/md_Hero-1.0.dmg --generate-notes
